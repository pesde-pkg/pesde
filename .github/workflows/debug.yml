name: Debug

on:
  push:
  pull_request:

env:
  CRATE_NAME: pesde
  BIN_NAME: pesde
  SQLX_OFFLINE: 1

jobs:
  prepare:
    name: Get build version
    runs-on: ubuntu-latest
    outputs:
      version: v${{ steps.get_version.outputs.value }}+rev.g${{ steps.trim_sha.outputs.trimmed_sha }}
      toolchain: ${{ steps.extract-toolchain-version.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract Toolchain version from rust-toolchain.toml
        id: extract-toolchain-version
        uses: mikefarah/yq@v4
        with:
          cmd: yq '.toolchain.channel' rust-toolchain.toml

      - name: Get package version
        id: get_version
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "${{ env.CRATE_NAME }}") | .version')
          echo "value=$VERSION" >> $GITHUB_OUTPUT

      - name: Trim commit SHA
        id: trim_sha
        run: |
          commit_sha=${{ github.sha }}
          echo "trimmed_sha=${commit_sha:0:7}" | tee $GITHUB_OUTPUT
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            host: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu

          - runner: ubuntu-24.04-arm
            host: linux
            arch: aarch64
            target: aarch64-unknown-linux-gnu

          - runner: windows-latest
            host: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc

          - runner: macos-15-intel
            host: macos
            arch: x86_64
            target: x86_64-apple-darwin

          - runner: macos-latest
            host: macos
            arch: aarch64
            target: aarch64-apple-darwin
    name: Build for ${{ matrix.host }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.prepare.outputs.toolchain }}

      - name: Compile in debug mode
        run: cargo build --bin ${{ env.CRATE_NAME }} --all-features --target ${{ matrix.target }} --locked

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BIN_NAME }}-debug-${{ needs.prepare.outputs.version }}-${{ matrix.host }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/debug/${{ env.BIN_NAME }}.exe
            target/${{ matrix.target }}/debug/${{ env.BIN_NAME }}
