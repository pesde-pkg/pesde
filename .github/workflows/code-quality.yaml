name: Code Quality
on:
  - push
  - pull_request

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: 1

jobs:
  prepare:
    name: Get build version
    runs-on: ubuntu-latest
    outputs:
      toolchain: ${{ steps.extract-toolchain-version.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract Toolchain version from rust-toolchain.toml
        id: extract-toolchain-version
        uses: mikefarah/yq@v4
        with:
          cmd: yq '.toolchain.channel' rust-toolchain.toml
  lint:
    runs-on: ubuntu-latest
    needs: [prepare]
    steps:
      - uses: actions/checkout@v6

      - name: Setup rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.prepare.outputs.toolchain }}
          components: clippy

      - name: Run clippy
        run: cargo clippy --all --all-targets --all-features -- -D warnings
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        # we use some nightly rustfmt features, so we need nightly toolchain
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check
  test:
    runs-on: ubuntu-latest
    needs: [prepare]
    steps:
      - uses: actions/checkout@v6

      - name: Setup rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.prepare.outputs.toolchain }}

      # - name: Install Tarpaulin
      #   run: |
      #     cargo install cargo-tarpaulin

      - name: Run tests
        run: cargo test --all --all-features

      # - name: Generate coverage report
      #   run: cargo tarpaulin --features patches --out xml --skip-clean

      # - name: Upload coverage reports to Codecov
      #   uses: codecov/codecov-action@v4.0.1
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
  sql-consistency:
    name: Check SQL (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - db: mysql
            database_url: mysql://root:root@127.0.0.1:3306/test-pesde-registry
    services:
      mariadb:
        image: ${{ matrix.db == 'mysql' && 'mariadb:11.8' || '' }}
        ports:
          - 3306:3306
        env:
          MARIADB_ROOT_PASSWORD: root
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: ${{ matrix.database_url }}
      SQLX_OFFLINE: 0
    needs: [prepare]
    steps:
      - uses: actions/checkout@v6

      - name: Setup rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.prepare.outputs.toolchain }}

      - name: Install SQLx CLI
        run: |
          cargo install sqlx-cli@^0.9

      - name: Setup database
        working-directory: crates/registry-backend-${{ matrix.db }}
        run: cargo sqlx database setup

      - name: Check query state
        working-directory: crates/registry-backend-${{ matrix.db }}
        run: cargo sqlx prepare --check
