[package]
name = "pesde-registry"
version = "0.3.0"
edition = "2024"
publish = false

[lints]
workspace = true

[features]
default = ["mysql"]
mysql = ["dep:pesde-registry-backend-mysql"]

[dependencies]
thiserror = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
toml = { workspace = true }
astral-tokio-tar = { workspace = true }
async-compression = { workspace = true }
itertools = { workspace = true }

fs-err = { version = "3.3.0", features = ["tokio"] }

pin-project-lite = "0.2.17"

actix-web = "4.17.0"
actix-web-lab = { version = "0.29.5", default-features = false }
actix-cors = "0.7.1"
actix-multipart = "0.7.2"
tracing-actix-web = "0.7.21"

dotenvy = "0.15.7"
rusty-s3 = "0.9.1"
constant_time_eq = "0.5.0"

pesde = { path = "../pesde", default-features = false }
pesde-registry-core = { path = "../registry-core" }

pesde-registry-backend-mysql = { path = "../registry-backend-mysql", optional = true }
