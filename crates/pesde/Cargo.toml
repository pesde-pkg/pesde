[package]
name = "pesde"
version = "0.8.0-beta.0"
edition = "2024"
license = "MIT"
authors = ["daimond113 <contact@daimond113.com>"]
description = "A package manager for the Luau programming language"
homepage = "https://pesde.daimond113.com"
repository = "https://github.com/pesde-pkg/pesde"
include = [
    "src/**/*",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "../../LICENSE",
    "CHANGELOG.md",
]

[[bin]]
name = "pesde"
path = "src/main.rs"
required-features = ["bin"]

[features]
default = ["bin"]
bin = [
    "tokio/rt",
    "tokio/rt-multi-thread",
    "tokio/fs",

    "dep:tokio-util",
    "dep:tracing-subscriber",
    "dep:reqwest",
    "dep:async_zip",
    "dep:astral-tokio-tar",
    "dep:async-compression",
    "dep:anyhow",
    "dep:serde_json",
    "dep:clap",
    "dep:gix",
    "dep:percent-encoding",
    "dep:rand",
    "dep:indicatif",
    "dep:console",
    "dep:bstr",
    "dep:directories",
    "dep:croshet",
    "dep:toml_edit",
    "dep:inquire",

    "dep:windows",
]

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
futures = { workspace = true }
itertools = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
paste = { workspace = true }
async-stream = { workspace = true }

thiserror-ext = { version = "0.3.0", default-features = false }

serde_ignored = { version = "0.1.14", default-features = false }
cbor-core = { version = "0.10.1", default-features = false }

fast32 = { version = "1.0.3", default-features = false }

blake3 = { version = "1.8.7", default-features = false, features = ["std"] }

signature = { version = "2.2.0", default-features = false, features = ["std"] }
ssh-key = { version = "0.6.7", default-features = false, features = [
    "std",
    "ed25519",
] }

semver = { version = "1.0.28", default-features = false, features = [
    "std",
    "serde",
] }

merkleberg = { version = "0.2.1", default-features = false, features = ["std"] }
merkle-bplustree = { version = "0.1.0", default-features = false, features = [
    "serde",
    "const",
] }

jiff = { version = "0.2.43", default-features = false, features = [
    "serde",
    "std",
] }

url = { version = "2.5.8", default-features = false, features = ["std"] }

wax = { version = "0.7.0", default-features = false }

ouroboros = { version = "0.18.5", default-features = false, features = ["std"] }

tokio-util = { workspace = true, features = ["compat"], optional = true }
tracing-subscriber = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json"], optional = true }
async_zip = { workspace = true, features = ["deflate"], optional = true }
astral-tokio-tar = { version = "0.7.1", default-features = false, optional = true }
async-compression = { workspace = true, features = [
    "tokio",
    "zstd",
    "gzip",
], optional = true }
anyhow = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "color",
    "error-context",
    "help",
    "suggestions",
    "usage",
    "derive",

    "deprecated",
], optional = true }
gix = { version = "0.90.0", default-features = false, features = [
    "blocking-http-transport-reqwest-rust-tls",
    "credentials",
    "revision",
    "revparse-regex",
    "max-control",
    "parallel",
    "max-performance",
    "tracing",
    "sha1",
    "sha256",
    "worktree-mutation",
], optional = true }
percent-encoding = { version = "2.3.2", default-features = false, features = [
    "alloc",
], optional = true }
rand = { version = "0.10.3", default-features = false, optional = true, features = [
    "thread_rng",
] }
indicatif = { version = "0.18.6", default-features = false, optional = true }
console = { version = "0.16.6", default-features = false, optional = true, features = [
    "std",
] }
bstr = { version = "1.13.1", default-features = false, optional = true, features = [
    "std",
] }
directories = { version = "6.0.0", default-features = false, optional = true }
croshet = { version = "0.1.0", default-features = false, optional = true, features = [
    "shell",
] }
toml_edit = { version = "0.25.19", default-features = false, optional = true, features = [
    "parse",
    "display",
] }
inquire = { version = "0.9.4", default-features = false, optional = true, features = [
    "console",
] }

[dev-dependencies]
opendal-core = { version = "0.59.5", default-features = false, features = [
    "executors-tokio",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Storage",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Console",
], optional = true }

[lints]
workspace = true
